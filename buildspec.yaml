---
version: 0.2

phases:
  pre_build:
    commands:
      # Variables de entorno
      - export EKS_CLUSTER_NAME="mycluster"
      - export ECR_BACKEND_REPO="usermgmt-marco"
      - export ECR_FRONTEND_REPO="usermgmt-marco-frontend"
      - export K8S_BACKEND_DEPLOYMENT="usermgmt-service"
      - export K8S_FRONTEND_DEPLOYMENT="frontend"
      - export K8S_BACKEND_CONTAINER_NAME="usermgmt"
      - export K8S_FRONTEND_CONTAINER_NAME="frontend"
      - export IMAGE_TAG=$(echo $CODEBUILD_BUILD_ID | cut -d: -f2 | cut -c 1-7)
      - export BACKEND_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND_REPO
      - export FRONTEND_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO
      - echo "Iniciando sesión en Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - echo "Configurando credenciales para el clúster de EKS $EKS_CLUSTER_NAME..."
      - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

  build:
    commands:
      - echo "Compilando el backend de Spring Boot con Maven..."
      - cd backend
      - mvn clean package
      - echo "Construyendo la imagen Docker del backend..."
      - docker build -t $BACKEND_URI:$IMAGE_TAG -f dockerfile .
      - cd ..
      - echo "Construyendo la imagen Docker del frontend..."
      - cd frontend
      - docker build -t $FRONTEND_URI:$IMAGE_TAG -f dockerfile .
      - cd ..

  post_build:
    commands:
      - echo "Subiendo la imagen del backend a ECR..."
      - docker push $BACKEND_URI:$IMAGE_TAG
      - echo "Subiendo la imagen del frontend a ECR..."
      - docker push $FRONTEND_URI:$IMAGE_TAG
      - echo "Actualizando el despliegue del backend en EKS..."
      - kubectl set image deployment/$K8S_BACKEND_DEPLOYMENT $K8S_BACKEND_CONTAINER_NAME=$BACKEND_URI:$IMAGE_TAG --namespace=myapp
      - echo "Actualizando el despliegue del frontend en EKS..."
      - kubectl set image deployment/$K8S_FRONTEND_DEPLOYMENT $K8S_FRONTEND_CONTAINER_NAME=$FRONTEND_URI:$IMAGE_TAG --namespace=myapp
      - echo "¡Pipeline completado exitosamente! ✅"
