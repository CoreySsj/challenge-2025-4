# .github/workflows/deploy-to-eks.yml

name: Build and Deploy to EKS

on:
  push:
    branches:
      - marco_kb # <-- Asegúrate que este sea el nombre de tu rama

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # 1. Configura las credenciales de AWS de forma segura
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_MARCO }}:role/GitHubAction-AssumeRole-For-CodeBuild
          aws-region: ${{ secrets.AWS_REGION_MARCO }}

      # 2. Inicia el proceso de compilación en AWS CodeBuild
      - name: Start AWS CodeBuild project
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: codebuild-usermgmt-build-marco
